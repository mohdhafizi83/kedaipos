name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --release
      - name: Verify zero-credential demo runs
        run: dart run bin/demo.dart > demo-output.txt && grep -q "Z-REPORT" demo-output.txt
