name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Third-party actions are pinned to full commit SHAs (supply-chain hygiene):
# the tag comment records the human-readable version; the SHA is what runs.

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1bb71f5ac2761c1ca7c1a841d7a6090e7bf0cb74 # v2.9.0
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --release
      - name: Verify zero-credential demo runs
        run: dart run bin/demo.dart > demo-output.txt && grep -q "Z-REPORT" demo-output.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # full history so gitleaks can catch secrets introduced AND removed
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
